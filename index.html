<style>

body{--d:100ms}

dialog{max-height:90vh;overflow:auto}

.lbin{max-width:1100px;margin:0 auto;background:var(--card);border-radius:16px;padding:18px}
.lbh{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}

.cmp.fit{aspect-ratio:var(--ar,1.333);width:min(100%,calc(78vh * var(--ar,1.333)));margin:0 auto;border-radius:10px}

.owner{max-width:1100px;margin:0 auto;padding:8px 20px 22px;display:flex;gap:18px;align-items:center}

.panel{margin-bottom:14px}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tg{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.tg.a{color:var(--ac);border-color:var(--ac)}
.tab{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:7px 14px;border-radius:99px;font-weight:600;font-size:13px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.filters{max-width:1100px;margin:0 auto;padding:0 20px 14px;display:flex;gap:8px;flex-wrap:wrap}
.lbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lbs:empty{display:none}
.stat{background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:14px}
.stat span{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.lbtabs{display:flex;gap:8px;margin:4px 0 12px}
.lbtabs:empty{display:none}
.lb3 model-viewer{width:100%;height:min(70vh,620px);background:#1b1b19;border-radius:10px;display:block}
.oacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.owner a.btn{text-decoration:none;font-size:14px;padding:9px 16px;border-radius:10px;display:inline-block;color:#fff}
.owner a.ghost{background:var(--card);padding:8px 14px}
#rmgl label,#rmdl label,#rcvw label{display:flex;gap:8px;align-items:center;margin:10px 0 0}
.dlb{text-decoration:none;font-size:14px;padding:9px 16px;border-radius:10px;color:#fff;align-self:center}
#intro h1{animation:none}
.l{display:inline-block;font-style:normal;opacity:0;animation:lt .6s cubic-bezier(.2,1.2,.4,1) forwards;animation-delay:var(--t)}
.l.key{animation-name:key;animation-duration:1s;animation-timing-function:cubic-bezier(.2,1.3,.4,1)}
@keyframes lt{from{opacity:0;transform:translateY(.4em)}to{opacity:1;transform:none}}
@keyframes key{0%{opacity:0;transform:scale(.15) rotate(-14deg);filter:blur(12px)}55%{opacity:1;transform:scale(1.3) rotate(4deg);filter:blur(0)}100%{opacity:1;transform:none;filter:none}}
#rphw label{display:flex;gap:8px;align-items:center;margin:10px 0 0}
</style>

<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.1.0/dist/tus.min.js"></script>
<script>
const SUPABASE_URL="https://vfagngbwifovofsxpnny.supabase.co";
const SUPABASE_KEY="sb_publishable_iGH1IHrPnVhmyQTqxgSdRg_ywXu1qMg";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let session=null,items=[],links=[],pos={},loaded=false,staggered=false,editing=null,profile=null,filter="all";
const safe=p=>/^[\w-]+\.(png|jpe?g|webp|gif|glb|pdf|blend)$/.test(String(p))?sb.storage.from("renders").getPublicUrl(p).data.publicUrl:"";
const isAdm=()=>!!session&&location.hash==="#admin";
const P={Instagram:"https://instagram.com/",ArtStation:"https://www.artstation.com/",Behance:"https://www.behance.net/",X:"https://x.com/",YouTube:"https://youtube.com/@",TikTok:"https://tiktok.com/@",LinkedIn:"https://linkedin.com/in/",Sketchfab:"https://sketchfab.com/",WhatsApp:"",Gmail:"",Otro:""};
const okUrl=u=>{try{const x=new URL(String(u));return /^(https?:|mailto:)$/.test(x.protocol)?x.href:null}catch(e){return null}};
function norm(pl,v){
  v=String(v).trim();if(!v)return null;
  if(pl==="Gmail")return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)?"mailto:"+v:null;
  if(pl==="WhatsApp"){
    if(/^https?:\/\//i.test(v)){try{const x=new URL(v);return /^(wa\.me|api\.whatsapp\.com)$/.test(x.hostname)?x.href:null}catch(e){return null}}
    const d=v.replace(/\D/g,"");return d.length>=8&&d.length<=15?"https://wa.me/"+d:null;
  }
  const u=/^https?:\/\//i.test(v)?v:(P[pl]?P[pl]+v.replace(/^@/,""):null);
  if(!u)return null;
  try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}
}
const el=h=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const dets=m=>(Array.isArray(m.details)?m.details:[]).slice(0,2);
const allPaths=m=>[m.wire_path,m.render_path,m.glb_path,m.blend_path,...dets(m).flatMap(d=>[d.wire_path,d.render_path])].filter(Boolean);
const okf=f=>/^image\/(png|jpe?g|webp|gif)$/.test(f.type);

/* ---------- Deslizador (malla / render) ---------- */
function slider(w,r,fit,p0,onp){
  const c=el(`<div class="cmp${fit?" fit":""}"><img alt="Render"><img class="top" alt="Malla"><div class="bar"></div><span class="tag l">Malla</span><span class="tag r">Render</span></div>`);
  const [b,t]=c.querySelectorAll("img");[b,t].forEach(i=>{i.decoding="async";i.loading=fit?"eager":"lazy"});b.src=r;t.src=w;
  const bar=c.querySelector(".bar");
  const set=p=>{c.style.setProperty("--p",p+"%");bar.style.left=p+"%";if(onp)onp(p)};
  set(p0);
  if(fit)b.addEventListener("load",()=>c.style.setProperty("--ar",b.naturalWidth/b.naturalHeight));
  const move=x=>{const q=c.getBoundingClientRect();set(Math.max(0,Math.min(100,(x-q.left)/q.width*100)))};
  let d=false;
  c.addEventListener("pointerdown",e=>{d=true;c.setPointerCapture(e.pointerId);move(e.clientX)});
  c.addEventListener("pointermove",e=>{if(d)move(e.clientX)});
  c.addEventListener("pointerup",()=>d=false);
  return c;
}

/* ---------- Visor ampliado ---------- */
let mvOk=false;
function loadMV(){
  if(mvOk)return;mvOk=true;
  const s=document.createElement("script");s.type="module";
  s.src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js";
  document.head.appendChild(s);
}
function openLb(m){
  const o=el('<div id="lb"><div class="lbin"><div class="lbh"><div><h2></h2><p></p></div><button class="ghost" id="lbx">Cerrar ✕</button></div><div class="lbs"></div><div class="lbtabs"></div><div class="lbm"></div><div class="lb3" hidden></div><div class="lbd"></div></div></div>');
  o.querySelector("h2").textContent=m.name;o.querySelector("p").textContent=m.descr||"";
  [["Categoría",m.category],["Software",m.software],["Polígonos",m.polys],["Tiempo",m.work_time]].filter(x=>x[1]).forEach(([k,v])=>{
    const d=el('<div class="stat"><span></span><b></b></div>');d.firstChild.textContent=k;d.lastChild.textContent=v;o.querySelector(".lbs").appendChild(d);
  });
  const bu=m.blend_path?safe(m.blend_path):(m.blend_url&&/^https:/i.test(m.blend_url)?okUrl(m.blend_url):"");
  if(bu){const a=el('<a class="btn dlb" rel="noopener noreferrer" target="_blank">⬇ Descargar archivo .blend</a>');a.href=bu;o.querySelector(".lbs").appendChild(a)}
  const lm=o.querySelector(".lbm"),l3=o.querySelector(".lb3");
  lm.appendChild(slider(safe(m.wire_path),safe(m.render_path),true,50));
  const g=m.glb_path?safe(m.glb_path):"";
  if(g){
    const tb=o.querySelector(".lbtabs"),b1=el('<button class="tab on">Malla / Render</button>'),b2=el('<button class="tab">3D interactivo</button>');
    tb.appendChild(b1);tb.appendChild(b2);
    let mv=null;
    const show=v=>{
      lm.hidden=v;l3.hidden=!v;b1.classList.toggle("on",!v);b2.classList.toggle("on",v);
      if(v&&!mv){
        loadMV();mv=document.createElement("model-viewer");
        mv.setAttribute("src",g);mv.setAttribute("alt","Modelo 3D de "+m.name);
        mv.setAttribute("camera-controls","");mv.setAttribute("auto-rotate","");
        mv.setAttribute("shadow-intensity","1");mv.setAttribute("environment-image","neutral");mv.setAttribute("touch-action","pan-y");
        l3.appendChild(mv);l3.appendChild(el('<p class="cap">Arrastra para girar · rueda o pellizco para acercar</p>'));
      }
    };
    b1.onclick=()=>show(false);b2.onclick=()=>show(true);
  }
  const d=dets(m),ld=o.querySelector(".lbd");
  if(d.length){
    ld.appendChild(el("<h3>Detalles</h3>"));
    d.forEach((x,i)=>{ld.appendChild(el('<p class="cap">Detalle '+(i+1)+" · malla / render</p>"));ld.appendChild(slider(safe(x.wire_path),safe(x.render_path),true,50))});
  }
  const esc=e=>{if(e.key==="Escape")close()};
  const close=()=>{o.remove();document.body.style.overflow="";document.removeEventListener("keydown",esc)};
  document.addEventListener("keydown",esc);
  o.addEventListener("click",e=>{if(e.target===o)close()});
  o.querySelector("#lbx").onclick=close;
  document.body.style.overflow="hidden";document.body.appendChild(o);
}

/* ---------- Tarjeta ---------- */
function card(m,adm,i,st){
  const c0=el(`<article class="card${st?" rise":""}" style="--i:${i}"><div class="slot"></div><div class="info"><div><h2 style="margin:0"><button class="nm"></button></h2><p></p><div class="tags"></div></div><div class="acts"></div></div></article>`);
  c0.querySelector(".slot").appendChild(slider(safe(m.wire_path),safe(m.render_path),false,pos[m.id]??50,p=>pos[m.id]=p));
  const nm=c0.querySelector(".nm");nm.textContent=m.name;nm.title="Ver completo";nm.onclick=()=>openLb(m);
  const p=c0.querySelector("p");p.textContent=m.descr||"";if(!m.descr)p.remove();
  const tg=c0.querySelector(".tags"),add=(t,a)=>{const s=document.createElement("span");s.className="tg"+(a?" a":"");s.textContent=t;tg.appendChild(s)};
  if(m.category)add(m.category);if(m.software)add(m.software);
  if(m.glb_path)add("3D interactivo",1);
  if(m.blend_path||m.blend_url)add("Descarga .blend",1);
  if(dets(m).length)add(dets(m).length+" detalle"+(dets(m).length>1?"s":""),1);
  if(!tg.children.length)tg.remove();
  c0.addEventListener("pointermove",e=>{const q=c0.getBoundingClientRect();c0.style.setProperty("--gx",(e.clientX-q.left)+"px");c0.style.setProperty("--gy",(e.clientY-q.top)+"px")});
  if(adm){
    const a=c0.querySelector(".acts");
    const e1=el('<button class="ghost">Editar</button>');e1.onclick=()=>openDlg(m);a.appendChild(e1);
    const b=el('<button class="ghost">Eliminar</button>');
    b.onclick=async()=>{
      if(!confirm("¿Eliminar este modelo?"))return;
      const {error}=await sb.from("models").delete().eq("id",m.id);
      if(error){alert("No se pudo eliminar.");return}
      await sb.storage.from("renders").remove(allPaths(m));
    };
    a.appendChild(b);
  }
  return c0;
}

/* ---------- Redes ---------- */
function socials(adm){
  const w=el('<div class="soc"></div>');
  links.forEach(l=>{
    if(adm){
      const ch=el('<span class="chip"><span></span><button title="Quitar">×</button></span>');
      ch.firstChild.textContent=l.platform;
      ch.querySelector("button").onclick=async()=>{await sb.from("socials").delete().eq("id",l.id)};
      w.appendChild(ch);
    }else{
      const a=document.createElement("a");a.href=okUrl(l.url)||"#inicio";if(a.protocol!=="mailto:")a.target="_blank";a.rel="noopener noreferrer";a.textContent=l.platform+" ↗";w.appendChild(a);
    }
  });
  return w;
}

function openDlg(m){

  ["mname","mdesc","mcat","msw","mpoly","mtime","f1","f2","g","bl","burl","d1w","d1r","d2w","d2r"].forEach(i=>$(i).value="");
  ["rmg","rmb","rmd"].forEach(i=>$(i).checked=false);
  if(m){$("mname").value=m.name||"";$("mdesc").value=m.descr||"";$("mcat").value=m.category||"";$("msw").value=m.software||"";$("mpoly").value=m.polys||"";$("mtime").value=m.work_time||"";$("burl").value=m.blend_url||""}
  $("cats").innerHTML="";
  [...new Set(["Personajes","Props","Entornos","Vehículos","Armas","Otros",...items.map(x=>x.category).filter(Boolean)])].forEach(c=>{const o=document.createElement("option");o.value=c;$("cats").appendChild(o)});
  $("dt").textContent=m?"Editar «"+m.name+"»":"Nuevo modelo";
  $("covh").textContent=m?"(vacío = conservar la actual)":"";
  $("rmgl").hidden=!(m&&m.glb_path);$("rmbl").hidden=!(m&&m.blend_path);$("rmdl").hidden=!(m&&dets(m).length);

async function optimize(f){
  if(f.type==="image/gif")return f;
  try{
    const bmp=await createImageBitmap(f);
    const k=Math.min(1,2400/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,"image/webp",.86));
    if(b&&b.type==="image/webp"&&b.size<f.size)return b;
  }catch(e){}
  return f;
}
async function up(f){
  const o=await optimize(f);
  const p=crypto.randomUUID()+"."+o.type.split("/")[1].replace("jpeg","jpg");
  const {error}=await sb.storage.from("renders").upload(p,o,{contentType:o.type});
  if(error)throw error;return p;
}
async function upFile(f,ext,type){
  const p=crypto.randomUUID()+"."+ext;
  const {error}=await sb.storage.from("renders").upload(p,f,{contentType:type});
  if(error)throw error;return p;
}
async function upBig(f,ext,type){
  const p=crypto.randomUUID()+"."+ext;type=type||"application/octet-stream";
  if(f.size>6*1024*1024&&window.tus&&session){
    try{await tusUp(f,p,type);return p}catch(e){}
  }
  const {error}=await sb.storage.from("renders").upload(p,f,{contentType:type});
  if(error)throw error;return p;
}
function tusUp(f,p,type){
  return new Promise((res,rej)=>{
    new tus.Upload(f,{
      endpoint:SUPABASE_URL+"/storage/v1/upload/resumable",
      retryDelays:[0,3000,5000,10000],
      headers:{authorization:"Bearer "+session.access_token,apikey:SUPABASE_KEY,"x-upsert":"true"},
      uploadDataDuringCreation:true,removeFingerprintOnSuccess:true,
      metadata:{bucketName:"renders",objectName:p,contentType:type,cacheControl:"3600"},
      chunkSize:6*1024*1024,
      onProgress:(a,b)=>{const t=$("save");if(t)t.textContent="Subiendo "+Math.round(a/b*100)+"%"},
      onError:rej,onSuccess:()=>res()
    }).start();
  });
}
async function save(){
  const E=editing,name=$("mname").value.trim();
  if(!name){alert("Falta el nombre.");return}
  const w=$("f1").files[0],r=$("f2").files[0];
  if(!E&&(!w||!r)){alert("Falta alguna de las dos imágenes de portada.");return}
  if(!w!==!r){alert("Para cambiar la portada sube malla y render.");return}
  if((w&&!okf(w))||(r&&!okf(r))){alert("Las imágenes deben ser PNG, JPG, WebP o GIF.");return}
  const g=$("g").files[0];
  if(g&&!/\.glb$/i.test(g.name)){alert("El modelo 3D interactivo debe ser un archivo .glb.");return}
  const bf=$("bl").files[0],bu=$("burl").value.trim();
  if(bf&&!/\.blend$/i.test(bf.name)){alert("El archivo original debe ser un .blend.");return}
  if(bu&&!(/^https:\/\//i.test(bu)&&okUrl(bu))){alert("El enlace de descarga debe empezar por https://");return}
  const pairs=[];
  for(const n of [1,2]){
    const a=$("d"+n+"w").files[0],b=$("d"+n+"r").files[0];
    if(!a&&!b)continue;
    if(!a||!b){alert("El detalle "+n+" necesita malla y render.");return}
    if(!okf(a)||!okf(b)){alert("Detalle "+n+": solo imágenes PNG, JPG, WebP o GIF.");return}
    pairs[n-1]=[a,b];
  }
  const btn=$("save");btn.disabled=true;btn.textContent="Subiendo…";
  try{
    const t=i=>$(i).value.trim();
    const upd={name:name.slice(0,80),descr:t("mdesc").slice(0,300),category:t("mcat").slice(0,40)||null,software:t("msw").slice(0,60)||null,polys:t("mpoly").slice(0,30)||null,work_time:t("mtime").slice(0,30)||null};
    const rm=[];
    if(w){upd.wire_path=await up(w);upd.render_path=await up(r);if(E)rm.push(E.wire_path,E.render_path)}
    if(g){upd.glb_path=await upBig(g,"glb","model/gltf-binary");if(E&&E.glb_path)rm.push(E.glb_path)}
    else if(E&&$("rmg").checked){upd.glb_path=null;if(E.glb_path)rm.push(E.glb_path)}
    if(bf){upd.blend_path=await upBig(bf,"blend","application/octet-stream");if(E&&E.blend_path)rm.push(E.blend_path)}
    else if(E&&$("rmb").checked){upd.blend_path=null;if(E.blend_path)rm.push(E.blend_path)}
    upd.blend_url=bu||null;
    let det=E?dets(E).slice():[];
    if(E&&$("rmd").checked){det.forEach(x=>rm.push(x.wire_path,x.render_path));det=[]}
    for(const i of [0,1])if(pairs[i]){
      if(det[i])rm.push(det[i].wire_path,det[i].render_path);
      det[i]={wire_path:await up(pairs[i][0]),render_path:await up(pairs[i][1])};
    }
    upd.details=det.filter(Boolean);
    const {error}=E?await sb.from("models").update(upd).eq("id",E.id):await sb.from("models").insert(upd);
    if(error)throw error;
    const del=rm.filter(Boolean);if(del.length)await sb.storage.from("renders").remove(del);
    $("dlg").close();
  }catch(e){const m=(e&&e.message)||"error";alert("No se pudo guardar: "+m+(/size|large|413|exceed|limit/i.test(m)?"\n\nEl archivo supera el límite de tu plan de Supabase (50 MB en el plan gratis). Usa el campo de enlace externo, comprime el .blend o sube de plan.":""))}
  btn.disabled=false;btn.textContent="Guardar";
}

async function saveProfile(){
  const name=$("pn").value.trim();
  if(!name){alert("Escribe tu nombre.");return}
  const f=$("pa").files[0],cv=$("pc").files[0];
  if(f&&!okf(f)){alert("La foto debe ser PNG, JPG, WebP o GIF.");return}
  if(cv&&cv.type!=="application/pdf"){alert("El CV debe ser un PDF.");return}
  const btn=$("ps");btn.disabled=true;btn.textContent="Guardando…";
  try{
    let path=(profile&&profile.avatar_path)||null,cvp=(profile&&profile.cv_path)||null;const rm=[];

/* ---------- Fondo de escamas que reacciona al cursor ---------- */
(function(){
  const cv=document.createElement("canvas");cv.id="bg";document.body.prepend(cv);
  const x=cv.getContext("2d"),reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  const S=46,R=S/2,RAD=200;
  let W=0,H=0,dpr=1,cols=0,rows=0,v=[],mx=-9999,my=-9999,raf=0,C=null;
  const hex=h=>{h=h.trim().replace("#","");if(h.length===3)h=h.replace(/./g,"$&$&");const n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]};
  const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const readC=()=>{const cs=getComputedStyle(document.documentElement),g=n=>cs.getPropertyValue(n).trim()||"#888888";C={bg:hex(g("--bg")),bd:hex(g("--bd")),ac:hex(g("--ac"))}};
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
    cols=Math.ceil(W/S)+2;rows=Math.ceil(H/R)+3;v=new Array(cols*rows).fill(0);
    readC();draw();
  }
  function draw(){
    if(!C)readC();
    x.setTransform(dpr,0,0,dpr,0,0);
    x.fillStyle=rgba(C.bg,1);x.fillRect(0,0,W,H);
    x.lineWidth=1;let moving=false;
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const i=r*cols+c,cx=c*S+(r%2?R:0),cy=r*R,dx=cx-mx,dy=cy-my,d=Math.hypot(dx,dy);
      const t=reduce?0:Math.max(0,1-d/RAD);
      v[i]+=(t-v[i])*.12;
      if(Math.abs(t-v[i])>.005)moving=true;else v[i]=t;
      const k=v[i],ox=d>0?dx/d*k*3:0,oy=d>0?dy/d*k*3-k*4:0;
      x.beginPath();x.arc(cx+ox,cy+oy,R*(1+k*.05),0,6.2832);
      x.fillStyle=rgba(C.bg,1);x.fill();
      if(k>.02){x.fillStyle=rgba(C.ac,k*.1);x.fill()}
      x.strokeStyle=rgba(C.bd,.9);x.stroke();
      if(k>.02){x.strokeStyle=rgba(C.ac,k*.5);x.stroke()}
    }
    return moving;
  }
  function tick(){raf=0;if(draw())kick()}
  function kick(){if(!raf)raf=requestAnimationFrame(tick)}
  size();addEventListener("resize",size);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{readC();kick()});
  if(!reduce){
    addEventListener("pointermove",e=>{mx=e.clientX;my=e.clientY;kick()});
    document.addEventListener("pointerleave",()=>{mx=my=-9999;kick()});
  }
})();

  render();
}
