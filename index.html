<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="description" content="Polyfolio: portafolio de modelado 3D. Compara la malla y el render de cada modelo con un deslizador.">
<meta property="og:title" content="Polyfolio · Portafolio 3D">
<meta property="og:description" content="Del wireframe a la luz: mis modelos 3D, malla y render.">
<title>Polyfolio · Portafolio 3D</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--tx:#1c1c1a;--mu:#6b6a65;--ac:#e8590c;--bd:#deddd8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1e1c;--tx:#f0efe9;--mu:#9a998f;--ac:#ff8a4c;--bd:#33332f}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1e1c;--tx:#f0efe9;--mu:#9a998f;--ac:#ff8a4c;--bd:#33332f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
header{max-width:1100px;margin:0 auto;padding:40px 20px 16px;display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:-.02em}
header p{margin:4px 0 0;color:var(--mu)}
button,.btn{font:inherit;background:var(--ac);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--mu);border:1px solid var(--bd);padding:6px 12px;font-weight:500;font-size:13px}
main{max-width:1100px;margin:0 auto;padding:12px 20px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,480px),1fr));gap:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.cmp{position:relative;aspect-ratio:4/3;background:#222;user-select:none;touch-action:pan-y;cursor:ew-resize;overflow:hidden}
.cmp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

.bar{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#fff;box-shadow:0 0 6px #0008}
.bar::after{content:"↔";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#fff;color:#111;display:grid;place-items:center;font-size:18px;box-shadow:0 2px 8px #0006}
.tag{position:absolute;bottom:10px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:#000a;color:#fff;padding:3px 8px;border-radius:6px}
.tag.l{left:10px}.tag.r{right:10px}
.info{padding:14px 16px;display:flex;justify-content:space-between;gap:10px;align-items:start}
.info h2{margin:0;font-size:18px}.info p{margin:2px 0 0;color:var(--mu);font-size:14px}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);padding:24px;width:min(92vw,440px)}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mu);margin:14px 0 4px}
input[type=text],textarea{width:100%;font:inherit;padding:9px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
input[type=file]{width:100%;font-size:13px}
.row{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:60px 0}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.badge.live::before{content:"● ";color:#2ea043}
.badge.adm{color:var(--ac);border-color:var(--ac)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-weight:800;letter-spacing:-.03em}.brand span{color:var(--ac)}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.soc a,.soc .chip{font-size:13px;font-weight:600;padding:6px 14px;border-radius:99px;border:1px solid var(--bd);color:var(--tx);text-decoration:none;background:var(--card);display:inline-flex;gap:8px;align-items:center}
.soc a:hover{border-color:var(--ac);color:var(--ac)}
.chip button{padding:0 4px;background:none;color:var(--mu);font-size:15px;line-height:1}
.panel{max-width:1100px;margin:0 auto;padding:0 20px 8px}
.panel>div{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
.panel h3{margin:0 0 4px;font-size:15px}
.frm{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.frm select,.frm input{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
.frm input{flex:1;min-width:180px}
a.ghost{font-size:13px;color:var(--mu);border:1px solid var(--bd);padding:6px 12px;border-radius:10px;text-decoration:none}
.login{max-width:340px;margin:60px auto;padding:0 20px;display:grid;gap:10px}.login input{font:inherit;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}

body{--d:100ms}
.brand{display:inline-block}
#app{position:relative;z-index:1}
.cmp{--p:50%}
.top{-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--p) - 4%),transparent calc(var(--p) + 4%));mask-image:linear-gradient(90deg,#000 calc(var(--p) - 4%),transparent calc(var(--p) + 4%))}
.bar{box-shadow:0 0 6px 2px rgba(255,255,255,.9),0 0 18px 8px rgba(255,255,255,.4),0 0 40px 18px rgba(255,255,255,.18)}
.bar::before{content:"";position:absolute;top:0;bottom:0;left:-16px;right:-16px;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);-webkit-mask-image:linear-gradient(90deg,transparent,#000 50%,transparent);mask-image:linear-gradient(90deg,transparent,#000 50%,transparent)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:100}
#glow{position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;border-radius:50%;pointer-events:none;z-index:0;opacity:0;transition:opacity .4s,transform .15s ease-out;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 24%,transparent),transparent 65%)}
.card{position:relative;transition:border-color .25s}
.card:hover{border-color:var(--ac)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--gx,50%) var(--gy,50%),color-mix(in srgb,var(--ac) 16%,transparent),transparent 70%)}
.card:hover::before{opacity:1}
.rise{animation:rise .7s both;animation-delay:calc(var(--i,0)*90ms + var(--d))}
.info .nm{background:none;color:var(--tx);font:inherit;font-size:18px;font-weight:700;padding:0;border:0;cursor:pointer;text-align:left}
.info .nm::after{content:" \2197";color:var(--ac);opacity:.6}
.info .nm:hover{color:var(--ac)}
.acts{display:flex;gap:6px}
.info p span{color:var(--ac)}
dialog{max-height:90vh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dl{font-weight:700;margin-top:18px;font-size:14px}
#intro{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;place-content:center;text-align:center;transition:background .9s ease}
#intro h1{font-size:clamp(52px,13vw,130px);transform-origin:top left;transition:transform 1.1s cubic-bezier(.7,0,.2,1);animation:pop .9s backwards}
#intro p{color:var(--mu);margin:8px 0 0;transition:opacity .5s;animation:pop 1.2s backwards}
#intro.go{background:transparent;pointer-events:none}
#intro.go p{opacity:0}
.introing header h1{opacity:0}
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.88);overflow:auto;padding:20px 14px;animation:fade .25s}
.lbin{max-width:1100px;margin:0 auto;background:var(--card);border-radius:16px;padding:18px}
.lbh{display:flex;justify-content:space-between;gap:12px;align-items:start;margin-bottom:12px}
.lbh h2{margin:0;font-size:22px}.lbh p{margin:2px 0 0;color:var(--mu);font-size:14px}
.lbin h3{margin:28px 0 2px}.cap{margin:10px 0 6px;color:var(--mu);font-size:13px}
.cmp.fit{aspect-ratio:var(--ar,1.333);width:min(100%,calc(78vh * var(--ar,1.333)));margin:0 auto;border-radius:10px}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(26px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL="https://vfagngbwifovofsxpnny.supabase.co";
const SUPABASE_KEY="sb_publishable_iGH1IHrPnVhmyQTqxgSdRg_ywXu1qMg";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let session=null,items=[],links=[],pos={},loaded=false,staggered=false,editing=null;
const safe=p=>/^[\w-]+\.(png|jpe?g|webp|gif)$/.test(String(p))?sb.storage.from("renders").getPublicUrl(p).data.publicUrl:"";
const isAdm=()=>!!session&&location.hash==="#admin";
const P={Instagram:"https://instagram.com/",ArtStation:"https://www.artstation.com/",Behance:"https://www.behance.net/",X:"https://x.com/",YouTube:"https://youtube.com/@",TikTok:"https://tiktok.com/@",LinkedIn:"https://linkedin.com/in/",Sketchfab:"https://sketchfab.com/",Otro:""};
function norm(pl,v){
  v=String(v).trim();if(!v)return null;
  const u=/^https?:\/\//i.test(v)?v:(P[pl]?P[pl]+v.replace(/^@/,""):null);
  if(!u)return null;
  try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:null}catch(e){return null}
}
const el=h=>{const d=document.createElement("div");d.innerHTML=h;return d.firstElementChild};
const dets=m=>(Array.isArray(m.details)?m.details:[]).slice(0,2);
const allPaths=m=>[m.wire_path,m.render_path,...dets(m).flatMap(d=>[d.wire_path,d.render_path])].filter(Boolean);
const okf=f=>/^image\/(png|jpe?g|webp|gif)$/.test(f.type)&&f.size<=10*1024*1024;

/* ---------- Deslizador (malla / render) ---------- */
function slider(w,r,fit,p0,onp){
  const c=el(`<div class="cmp${fit?" fit":""}"><img alt="Render"><img class="top" alt="Malla"><div class="bar"></div><span class="tag l">Malla</span><span class="tag r">Render</span></div>`);
  const [b,t]=c.querySelectorAll("img");b.src=r;t.src=w;
  const bar=c.querySelector(".bar");
  const set=p=>{c.style.setProperty("--p",p+"%");bar.style.left=p+"%";if(onp)onp(p)};
  set(p0);
  if(fit)b.addEventListener("load",()=>c.style.setProperty("--ar",b.naturalWidth/b.naturalHeight));
  const move=x=>{const q=c.getBoundingClientRect();set(Math.max(0,Math.min(100,(x-q.left)/q.width*100)))};
  let d=false;
  c.addEventListener("pointerdown",e=>{d=true;c.setPointerCapture(e.pointerId);move(e.clientX)});
  c.addEventListener("pointermove",e=>{if(d)move(e.clientX)});
  c.addEventListener("pointerup",()=>d=false);
  return c;
}

/* ---------- Visor ampliado ---------- */
function openLb(m){
  const o=el('<div id="lb"><div class="lbin"><div class="lbh"><div><h2></h2><p></p></div><button class="ghost" id="lbx">Cerrar ✕</button></div><div class="lbm"></div><div class="lbd"></div></div></div>');
  o.querySelector("h2").textContent=m.name;o.querySelector("p").textContent=m.descr||"";
  o.querySelector(".lbm").appendChild(slider(safe(m.wire_path),safe(m.render_path),true,50));
  const d=dets(m),ld=o.querySelector(".lbd");
  if(d.length){
    ld.appendChild(el("<h3>Detalles</h3>"));
    d.forEach((x,i)=>{ld.appendChild(el('<p class="cap">Detalle '+(i+1)+" · malla / render</p>"));ld.appendChild(slider(safe(x.wire_path),safe(x.render_path),true,50))});
  }
  const esc=e=>{if(e.key==="Escape")close()};
  const close=()=>{o.remove();document.body.style.overflow="";document.removeEventListener("keydown",esc)};
  document.addEventListener("keydown",esc);
  o.addEventListener("click",e=>{if(e.target===o)close()});
  o.querySelector("#lbx").onclick=close;
  document.body.style.overflow="hidden";document.body.appendChild(o);
}

/* ---------- Tarjeta ---------- */
function card(m,adm,i,st){
  const c0=el(`<article class="card${st?" rise":""}" style="--i:${i}"><div class="slot"></div><div class="info"><div><h2 style="margin:0"><button class="nm"></button></h2><p></p></div><div class="acts"></div></div></article>`);
  c0.querySelector(".slot").appendChild(slider(safe(m.wire_path),safe(m.render_path),false,pos[m.id]??50,p=>pos[m.id]=p));
  const nm=c0.querySelector(".nm");nm.textContent=m.name;nm.title="Ver completo";nm.onclick=()=>openLb(m);
  const p=c0.querySelector("p");p.textContent=m.descr||"";
  if(dets(m).length){const s=document.createElement("span");s.textContent=(m.descr?" · ":"")+dets(m).length+" detalle"+(dets(m).length>1?"s":"");p.appendChild(s)}
  c0.addEventListener("pointermove",e=>{const q=c0.getBoundingClientRect();c0.style.setProperty("--gx",(e.clientX-q.left)+"px");c0.style.setProperty("--gy",(e.clientY-q.top)+"px")});
  if(adm){
    const a=c0.querySelector(".acts");
    const e1=el('<button class="ghost">Detalles</button>');e1.onclick=()=>openDlg(m);a.appendChild(e1);
    const b=el('<button class="ghost">Eliminar</button>');
    b.onclick=async()=>{
      if(!confirm("¿Eliminar este modelo?"))return;
      const {error}=await sb.from("models").delete().eq("id",m.id);
      if(error){alert("No se pudo eliminar.");return}
      await sb.storage.from("renders").remove(allPaths(m));
    };
    a.appendChild(b);
  }
  return c0;
}

/* ---------- Redes ---------- */
function socials(adm){
  const w=el('<div class="soc"></div>');
  links.forEach(l=>{
    if(adm){
      const ch=el('<span class="chip"><span></span><button title="Quitar">×</button></span>');
      ch.firstChild.textContent=l.platform;
      ch.querySelector("button").onclick=async()=>{await sb.from("socials").delete().eq("id",l.id)};
      w.appendChild(ch);
    }else{
      const a=document.createElement("a");a.href=norm("Otro",l.url)||"#inicio";a.target="_blank";a.rel="noopener noreferrer";a.textContent=l.platform+" ↗";w.appendChild(a);
    }
  });
  return w;
}
function loginView(){
  const f=el('<div class="login"><h1 class="brand">Poly<span>folio</span></h1><p style="color:var(--mu);margin:0">Acceso de administrador</p><input id="em" type="email" placeholder="Correo" autocomplete="username"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button id="go">Entrar</button><a class="ghost" href="#inicio" style="text-align:center">Ver sitio público</a></div>');
  const go=async()=>{
    const {error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
    if(error)alert("Correo o contraseña incorrectos.");
  };
  f.querySelector("#go").onclick=go;
  f.querySelector("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
  return f;
}

/* ---------- Formulario del administrador ---------- */
function ensureDlg(){
  if($("dlg"))return;
  const d=el(`<dialog id="dlg"><h2 id="dt" style="margin:0">Nuevo modelo</h2>
  <div id="mainf"><label>Nombre</label><input type="text" id="name" maxlength="80"><label>Descripción (opcional)</label><textarea id="desc" rows="2" maxlength="300"></textarea>
  <div class="dl">Portada</div><div class="two"><div><label>Malla</label><input type="file" id="f1" accept="image/*"></div><div><label>Render</label><input type="file" id="f2" accept="image/*"></div></div></div>
  <div class="dl">Detalle 1 (opcional)</div><div class="two"><div><label>Malla</label><input type="file" id="d1w" accept="image/*"></div><div><label>Render</label><input type="file" id="d1r" accept="image/*"></div></div>
  <div class="dl">Detalle 2 (opcional)</div><div class="two"><div><label>Malla</label><input type="file" id="d2w" accept="image/*"></div><div><label>Render</label><input type="file" id="d2r" accept="image/*"></div></div>
  <p id="dh" style="font-size:12px;color:var(--mu)">Cada detalle necesita malla y render. PNG, JPG, WebP o GIF, máximo 10 MB.</p>
  <div class="row"><button class="ghost" id="cancel">Cancelar</button><button id="save">Guardar</button></div></dialog>`);
  document.body.appendChild(d);
  $("cancel").onclick=()=>$("dlg").close();$("save").onclick=save;
}
function openDlg(m){
  ensureDlg();editing=m||null;
  ["name","desc","f1","f2","d1w","d1r","d2w","d2r"].forEach(i=>$(i).value="");
  $("mainf").hidden=!!m;
  $("dt").textContent=m?"Detalles de «"+m.name+"»":"Nuevo modelo";
  $("dh").textContent=(m?"Los detalles que subas reemplazan a los actuales. Sin archivos = se quitan. ":"")+"Cada detalle necesita malla y render. PNG, JPG, WebP o GIF, máximo 10 MB.";
  $("dlg").showModal();
}
async function up(f){
  const p=crypto.randomUUID()+"."+f.type.split("/")[1].replace("jpeg","jpg");
  const {error}=await sb.storage.from("renders").upload(p,f,{contentType:f.type});
  if(error)throw error;return p;
}
async function save(){
  const pairs=[];
  for(const n of [1,2]){
    const w=$("d"+n+"w").files[0],r=$("d"+n+"r").files[0];
    if(!w&&!r)continue;
    if(!w||!r){alert("El detalle "+n+" necesita malla y render.");return}
    if(!okf(w)||!okf(r)){alert("Detalle "+n+": solo PNG, JPG, WebP o GIF de máximo 10 MB.");return}
    pairs.push([w,r]);
  }
  let w,r,name;
  if(!editing){
    w=$("f1").files[0];r=$("f2").files[0];name=$("name").value.trim();
    if(!w||!r||!name){alert("Falta el nombre o alguna de las dos imágenes de portada.");return}
    if(!okf(w)||!okf(r)){alert("Solo imágenes PNG, JPG, WebP o GIF de máximo 10 MB.");return}
  }else if(!pairs.length&&!confirm("No elegiste imágenes: se quitarán los detalles de este modelo. ¿Continuar?"))return;
  const btn=$("save");btn.disabled=true;btn.textContent="Subiendo…";
  try{
    const det=[];
    for(const [a,b] of pairs)det.push({wire_path:await up(a),render_path:await up(b)});
    if(editing){
      const {error}=await sb.from("models").update({details:det}).eq("id",editing.id);
      if(error)throw error;
      const old=dets(editing).flatMap(d=>[d.wire_path,d.render_path]).filter(Boolean);
      if(old.length)await sb.storage.from("renders").remove(old);
    }else{
      const a=await up(w),b=await up(r);
      const {error}=await sb.from("models").insert({name:name.slice(0,80),descr:$("desc").value.trim().slice(0,300),wire_path:a,render_path:b,details:det});
      if(error)throw error;
    }
    $("dlg").close();
  }catch(e){alert("No se pudo guardar: "+(e.message||"error"))}
  btn.disabled=false;btn.textContent="Guardar";
}

/* ---------- Pantalla ---------- */
function render(){
  const app=$("app");app.innerHTML="";
  if(location.hash==="#admin"&&!session){app.appendChild(loginView());return}
  const adm=isAdm();
  const hd=el(`<header><div><h1 class="brand">Poly<span>folio</span></h1><p>${adm?"Panel de administración":"Del wireframe a la luz · arrastra para comparar malla y render"}</p></div><div class="tools"></div></header>`);
  const tools=hd.querySelector(".tools");
  if(adm){
    tools.appendChild(el('<a class="ghost" href="#inicio">Ver sitio público</a>'));
    const o=el('<button class="ghost">Cerrar sesión</button>');o.onclick=()=>sb.auth.signOut();tools.appendChild(o);
    const b=el('<button>+ Añadir modelo</button>');b.onclick=()=>openDlg();tools.appendChild(b);
  }else tools.appendChild(el('<span class="badge live">En vivo</span>'));
  if(!adm&&links.length)hd.firstChild.appendChild(socials(false));
  app.appendChild(hd);
  if(adm){
    const p=el(`<div class="panel"><div><h3>Redes sociales</h3><p style="margin:0;color:var(--mu);font-size:13px">Escribe tu usuario o pega el enlace completo.</p><div class="frm"><select id="pl">${Object.keys(P).map(k=>`<option>${k}</option>`).join("")}</select><input id="us" placeholder="@usuario o https://…"><button id="ad">Añadir</button></div></div></div>`);
    p.firstChild.insertBefore(socials(true),p.querySelector(".frm"));
    p.querySelector("#ad").onclick=async()=>{
      const pl=p.querySelector("#pl").value,u=norm(pl,p.querySelector("#us").value);
      if(!u){alert("Enlace no válido. Para «Otro» pega la URL completa (https://…).");return}
      if(links.length>=12){alert("Máximo 12 redes.");return}
      const {error}=await sb.from("socials").insert({platform:pl,url:u});
      if(error)alert("No se pudo guardar.");
    };
    app.appendChild(p);
  }
  const g=el('<main id="grid"></main>');
  if(!loaded)g.innerHTML='<div class="empty">Cargando…</div>';
  else if(!items.length)g.innerHTML='<div class="empty">'+(adm?"Aún no hay modelos. Pulsa “Añadir modelo”.":"Pronto habrá modelos nuevos por aquí.")+"</div>";
  else{const st=!staggered;items.forEach((m,i)=>g.appendChild(card(m,adm,i,st)));staggered=true}
  app.appendChild(g);
}

/* ---------- Bienvenida (solo público) ---------- */
function intro(){
  if(location.hash==="#admin"||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  if(!document.querySelector("header h1"))return;
  document.body.classList.add("introing");document.body.style.setProperty("--d","1100ms");
  const o=el('<div id="intro"><h1 class="brand">Poly<span>folio</span></h1><p>Del wireframe a la luz</p></div>');
  document.body.appendChild(o);
  const t=o.firstChild;
  setTimeout(()=>{
    const real=document.querySelector("header h1");if(!real){o.remove();document.body.classList.remove("introing");return}
    const a=t.getBoundingClientRect(),b=real.getBoundingClientRect();
    o.classList.add("go");
    t.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width})`;
    setTimeout(()=>{document.body.classList.remove("introing");o.remove()},1150);
  },1900);
}

/* ---------- Luz y partículas del cursor ---------- */
(function(){
  if(matchMedia("(pointer:coarse)").matches||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
  const cv=document.createElement("canvas");cv.id="fx";
  const gl=document.createElement("div");gl.id="glow";
  document.body.appendChild(gl);document.body.appendChild(cv);
  const x=cv.getContext("2d");let w,h,ps=[],col="#e8590c",n=0;
  const rs=()=>{w=cv.width=innerWidth;h=cv.height=innerHeight};rs();addEventListener("resize",rs);
  addEventListener("pointermove",e=>{
    gl.style.opacity=1;gl.style.transform=`translate(${e.clientX}px,${e.clientY}px)`;
    for(let i=0;i<2&&ps.length<160;i++)ps.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*1.4,vy:(Math.random()-.5)*1.4-.3,l:1,s:1+Math.random()*2.2});
  });
  document.addEventListener("pointerleave",()=>gl.style.opacity=0);
  (function loop(){
    if(n++%30===0)col=getComputedStyle(document.documentElement).getPropertyValue("--ac").trim()||col;
    x.clearRect(0,0,w,h);
    ps=ps.filter(p=>p.l>0);
    ps.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.l-=.02;
      x.fillStyle=col;
      x.globalAlpha=Math.max(p.l,0)*.18;x.beginPath();x.arc(p.x,p.y,p.s*3.2,0,6.283);x.fill();
      x.globalAlpha=Math.max(p.l,0);x.beginPath();x.arc(p.x,p.y,p.s*p.l+.3,0,6.283);x.fill();
    });
    x.globalAlpha=1;
    requestAnimationFrame(loop);
  })();
})();

render();intro();
sb.auth.getSession().then(({data})=>{session=data.session;render();load()});
